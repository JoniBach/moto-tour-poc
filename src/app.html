<!doctype html>
<html lang="%tour.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#03070c" />
		<meta name="text-scale" content="scale" />
		<!-- in the static shell, not svelte:head: the tour's pages render in the browser, and without
		     this the browser asks for /favicon.ico before any script runs -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta property="og:site_name" content="%tour.site%" />
		<meta property="og:type" content="website" />
		%tour.feed%
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
