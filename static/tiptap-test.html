<!doctype html>
<!--
  Step 1 of the WYSIWYG story editor, the plain half: Tiptap alone on a page (bundled from
  src/lib/spike/tiptapSpike.js by `npm run spike:bundle`), no framework, no site styles. The other
  half, inside the site, is /wysiwyg/spike. Not linked; temporary.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Tiptap test (plain)</title>
		<style>
			body {
				margin: 0;
				padding: 16px;
				font: 17px/1.6 Georgia, serif;
				background: #fff;
				color: #222;
			}
			.stats {
				position: sticky;
				top: 0;
				z-index: 1;
				padding: 8px 10px;
				border-radius: 10px;
				background: #263238;
				color: #fff;
				font: 13px/1.4 -apple-system, system-ui, sans-serif;
			}
			.doc {
				max-width: 40rem;
				margin: 16px auto;
			}
			.doc .ProseMirror {
				outline: none;
				min-height: 50vh;
			}
		</style>
	</head>
	<body>
		<div class="stats"><b>Plain page</b> · <span id="out">loading…</span> <button type="button" id="reset">Reset</button></div>
		<div class="doc" id="doc"></div>
		<script type="module">
			import { mountSpike } from './tiptap-test.js';
			const spike = mountSpike(document.getElementById('doc'), document.getElementById('out'));
			document.getElementById('reset').addEventListener('click', () => spike.reset());
		</script>
	</body>
</html>
